<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRT Live</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #eaf2ff; min-height: 100vh; padding: 1rem;
  background-color: #0b2545; background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d?auto=format&fit=crop&w=2400&q=85");
  background-size: cover; background-position: center; background-attachment: fixed; display: flex; justify-content: center; }
body[data-theme="unsplash-football"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-basketball"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-volleyball"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-running"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-crowd"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1504450758481-7338eba7524a?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-night"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-arena"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-field"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1579952363873-27f3b2af8647?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="unsplash-neon"] { background-image: linear-gradient(rgba(2,6,23,.42), rgba(2,6,23,.72)), url("https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=2400&q=85"); }
body[data-theme="gradient-sunset"] { background: linear-gradient(135deg, #ff6a00, #ee0979); }
body[data-theme="gradient-forest"] { background: linear-gradient(135deg, #11998e, #38ef7d); }
body[data-theme="gradient-midnight"] { background: linear-gradient(135deg, #232526, #414345); }
body[data-theme="gradient-ocean"] { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
.wrap { width: min(1400px, 100%); margin: 0 auto; padding: clamp(.5rem, 2vw, 1.5rem); }
h1 { font-size: 1.7rem; margin-bottom: .2rem; }
h1 span { background: linear-gradient(90deg,#3b82f6,#ffd60a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.meta { color: #9db4d4; margin-bottom: 1rem; }
.banner { background: linear-gradient(90deg,#ffd60a,#fbbf24); color: #111; font-weight: 800; font-size: 1.3rem; text-align: center; border-radius: 14px; padding: 1rem; margin: 1rem 0; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.round { color: #ffd60a; font-weight: 700; margin: 1rem 0 .4rem; font-size: 1.05rem; }
.match { display: grid; grid-template-columns: 1fr auto 1fr; gap: .8rem; align-items: center; background: rgba(8,25,52,.78); border-radius: 12px; padding: .7rem 1rem; margin: .35rem 0;
  border: 1px solid rgba(255,255,255,.1); border-left: 4px solid #3b82f6; box-shadow: 0 6px 18px rgba(0,0,0,.22); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.match.bronze { border: 2px solid #B45309; }
.match .h { text-align: right; font-weight: 600; }
.match .a { text-align: left; font-weight: 600; }
.match .s { background: rgba(255,255,255,.13); border-radius: 8px; padding: .25rem .7rem; font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.match .s.offen { color: #9db4d4; font-weight: 400; font-size: .9rem; }
.match .when { grid-column: 1 / -1; color: #9db4d4; font-size: .78rem; }
table { width: 100%; border-collapse: collapse; margin: .5rem 0 1rem; background: rgba(22,52,95,.72); border-radius: 12px; overflow: hidden; }
th { background: #3b82f6; padding: .5rem; text-align: left; font-size: .85rem; }
td { padding: .45rem .5rem; border-top: 1px solid rgba(255,255,255,.08); font-size: .9rem; }
tr.hl td { font-weight: 800; background: rgba(74,222,128,.16); }
.live { display: inline-block; width: 10px; height: 10px; background: #22c55e; border-radius: 50%; margin-right: .4rem; animation: blink 1.5s infinite; box-shadow: 0 0 8px #22c55e; }
@keyframes blink { 50% { opacity: .25; } }
footer { text-align: center; color: #9db4d4; font-size: .8rem; margin-top: 2rem; }
.err { text-align: center; font-size: 1.2rem; margin-top: 4rem; }
.two { display: grid; grid-template-columns: 2fr 1fr; gap: 1.25rem; align-items: start; }
@media (max-width: 700px) { .two { grid-template-columns: 1fr; } .match { gap: .4rem; font-size: .92rem; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>&#127942; <span id="tName">Lade Turnier ...</span></h1>
  <p class="meta" id="tMeta"><span class="live"></span>Live-Ansicht &middot; aktualisiert alle 10 s</p>
  <div id="champ"></div>
  <div class="two">
    <div><h2>&#127918; Spiele</h2><div id="matches">...</div></div>
    <div><h2>&#128202; Tabelle</h2><div id="table"></div></div>
  </div>
  <footer>TheRealTournament &middot; Live</footer>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = location.pathname.split('/').pop();

fetch('/api/settings/theme').then(r => r.json()).then(d => {
  document.body.dataset.theme = d.theme || 'gradient-blue';
}).catch(() => {});

async function load() {
  try {
    const d = await fetch('/api/public/' + token).then(r => { if (!r.ok) throw 0; return r.json(); });
    render(d);
  } catch (e) {
    document.getElementById('matches').innerHTML = '<div class="err">&#128274; Turnier nicht (mehr) &ouml;ffentlich</div>';
    clearInterval(timer);
  }
}

function chip(side, m) {
  const n = side === 'h' ? m.home_name : m.away_name;
  const e = side === 'h' ? m.home_emoji : m.away_emoji;
  const lo = side === 'h' ? m.home_logo : m.away_logo;
  if (!n) return '&#10068; TBD';
  return esc(e || '') + (lo ? ' <img src="/logos/' + esc(lo) + '" style="height:20px;vertical-align:middle;border-radius:4px"> ' : ' ') + esc(n);
}

function render(d) {
  document.getElementById('tName').textContent = d.tournament.name;
  document.getElementById('tMeta').innerHTML = '<span class="live"></span>' + esc(d.tournament.sport) + ' &middot; ' + esc(d.tournament.start_date || '') + ' &middot; Live';
  document.getElementById('champ').innerHTML = d.champion
    ? '<div class="banner">&#127881;&#127942; Turniersieger: ' + esc(d.champion.emoji || '') + ' ' + esc(d.champion.name) + ' &#127942;&#127881;</div>' : '';

  const ms = d.matches || [];
  let html = '', last = null;
  for (const m of ms) {
    const isP3 = m.group_name === 'Platz3';
    const key = isP3 ? m.round_name
      : (m.group_name && m.group_name !== 'Liga' ? '&#127757; Gruppe ' + esc(m.group_name) + ' &middot; ' : '') + esc(m.round_name);
    if (key !== last) { html += '<div class="round">' + (isP3 ? esc(key) : key) + '</div>'; last = key; }
    const done = m.status === 'erledigt';
    const score = done
      ? '<span class="s">' + m.home_score + ':' + m.away_score + (m.home_pen != null ? ' (' + m.home_pen + ':' + m.away_pen + ')' : '') + '</span>'
      : '<span class="s offen">&#9203;</span>';
    const when = [m.date, m.time, m.court].filter(Boolean).join(' &middot; ');
    html += '<div class="match' + (isP3 ? ' bronze' : '') + '"><div class="h">' + chip('h', m) + '</div>' + score + '<div class="a">' + chip('a', m) + '</div>'
      + (when ? '<div class="when">' + esc(when) + '</div>' : '') + '</div>';
  }
  document.getElementById('matches').innerHTML = html || '<p class="err">Noch keine Spiele</p>';

  const st = d.standings || [];
  if (st.length) {
    const groups = [...new Set(st.map(s => s.group || '-'))].sort();
    let th = '';
    for (const g of groups) {
      const rows = st.filter(s => (s.group || '-') === g);
      if (g !== '-' && g !== 'Liga') th += '<div class="round">&#127757; Gruppe ' + esc(g) + '</div>';
      th += '<table><tr><th>#</th><th>Team</th><th>Sp</th><th>Pkt</th></tr>' +
        rows.map((s, i) => '<tr' + (i === 0 ? ' class="hl"' : '') + '><td>' + (i + 1) + '</td><td>' + esc(s.emoji || '') + ' ' + esc(s.name) + '</td><td>' + s.sp + '</td><td>' + s.pts + '</td></tr>').join('') + '</table>';
    }
    document.getElementById('table').innerHTML = th;
  } else {
    document.getElementById('table').innerHTML = '<p style="color:#9db4d4">-</p>';
  }
}

load();
const timer = setInterval(load, 10000);
</script>
</body>
</html>
