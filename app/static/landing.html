<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheRealTournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8fafc;background:#07111f}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(120deg,rgba(5,15,35,.86),rgba(12,35,56,.65)),url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d?auto=format&fit=crop&w=2400&q=85") center/cover fixed}
.shell{width:min(980px,100%);text-align:center}.mark{font-size:4rem;filter:drop-shadow(0 8px 20px #0008)}h1{font-size:clamp(2.2rem,7vw,5rem);line-height:1;margin:12px 0;background:linear-gradient(90deg,#fff,#7dd3fc,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent}p{color:#cbd5e1;font-size:1.1rem}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:42px}.choice{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 24px;border:1px solid #ffffff2b;border-radius:24px;background:#0f2138b8;color:#fff;text-decoration:none;box-shadow:0 20px 60px #0005;backdrop-filter:blur(14px);transition:.2s}.choice:hover{transform:translateY(-5px);border-color:#7dd3fc;background:#163251e8}.icon{font-size:3rem}.choice strong{font-size:1.4rem}.choice small{color:#b6c7da}@media(max-width:600px){.choices{grid-template-columns:1fr}}
#trt-intro{--ink:#07111f;--line:#f4f6f8;--hot:#ff6a2b;position:fixed;inset:0;z-index:9999;background:var(--ink);color:var(--line);display:grid;place-items:center;overflow:hidden;clip-path:inset(0);transition:clip-path .9s cubic-bezier(.77,0,.18,1)}
#trt-intro.out{clip-path:inset(0 0 100% 0);pointer-events:none}
#trt-intro .court{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
#trt-intro .court *{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.6,0,.2,1) forwards}
#trt-intro .court .c{animation-delay:.25s}.trt-court .m{animation-delay:.1s}@keyframes draw{to{stroke-dashoffset:0}}
#trt-intro .box{position:relative;padding:0 6vw;max-width:900px}
#trt-intro h2{margin:0;font:800 clamp(3.2rem,13vw,8.5rem)/.88 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
#trt-intro h2 span{display:block;overflow:hidden}#trt-intro h2 b{display:block;font-weight:inherit;transform:translateY(105%);animation:up .8s cubic-bezier(.2,.9,.2,1) forwards}
#trt-intro h2 span:nth-child(1) b{animation-delay:.9s}#trt-intro h2 span:nth-child(2) b{animation-delay:1.05s;color:var(--hot)}@keyframes up{to{transform:none}}
#trt-intro .tag{margin:1.4rem 0 0;font:600 clamp(1.1rem,3vw,1.7rem)/1.3 Barlow,system-ui,sans-serif;opacity:0;animation:fade .7s 1.8s forwards}
#trt-intro .sub{margin:.4rem 0 0;font-size:clamp(.95rem,2.2vw,1.15rem);opacity:0;animation:fade .7s 2.1s forwards;color:#b9c7d6}@keyframes fade{to{opacity:1}}
#trt-intro .bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--hot);transform-origin:left;transform:scaleX(0);animation:bar 4.2s linear forwards}@keyframes bar{to{transform:scaleX(1)}}
#trt-intro button{position:absolute;right:max(1rem,3vw);bottom:max(1.4rem,4vh);font:600 1rem Barlow,system-ui,sans-serif;color:var(--line);background:transparent;border:2px solid var(--line);border-radius:999px;padding:.55rem 1.2rem;cursor:pointer}
#trt-intro button:hover{background:var(--hot);border-color:var(--hot)}#trt-intro button:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
@media(prefers-reduced-motion:reduce){#trt-intro *{animation-duration:.01s!important;animation-delay:0s!important}#trt-intro{transition:none}}
</style>
</head>
<body>
<main class="shell" id="trt-switch">
  <div class="mark">🏆</div><h1>TheRealTournament</h1>
  <p>Turniere planen, live verfolgen und gemeinsam feiern.</p>
  <div class="choices">
    <a class="choice" href="/view"><span class="icon">📺</span><strong>View</strong><small>Aktuelles Event für Beamer, TV oder Zuschauer öffnen</small></a>
    <a class="choice" href="/admin"><span class="icon">⚙️</span><strong>Admin</strong><small>Mit Benutzername und Passwort verwalten</small></a>
  </div>
</main>

<div id="trt-intro" role="dialog" aria-modal="true" aria-label="Willkommen bei TheRealTournament">
  <svg class="court trt-court" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect class="m" x="60" y="60" width="1080" height="580" pathLength="1"/>
    <line class="m" x1="600" y1="60" x2="600" y2="640" pathLength="1"/>
    <circle class="c" cx="600" cy="350" r="110" pathLength="1"/>
    <rect class="c" x="60" y="220" width="190" height="260" pathLength="1"/>
    <rect class="c" x="950" y="220" width="190" height="260" pathLength="1"/>
  </svg>
  <div class="box">
    <h2><span><b>The Real</b></span><span><b>Tournament</b></span></h2>
    <p class="tag">Fair geplant. Live verfolgt.</p>
    <p class="sub">Liga, K.o. und Gruppen - für jede Klasse und jede Sportart.</p>
  </div>
  <button type="button" id="trt-skip">Turniere ansehen</button>
  <div class="bar"></div>
</div>

<script>
(function () {
  const intro = document.getElementById('trt-intro');
  const skip = document.getElementById('trt-skip');
  let done = false;
  try {
    if (sessionStorage.getItem('trt-intro') === '1') intro.remove();
  } catch (error) {}
  if (!document.body.contains(intro)) return;
  function closeIntro() {
    if (done) return;
    done = true;
    try { sessionStorage.setItem('trt-intro', '1'); } catch (error) {}
    intro.classList.add('out');
    window.setTimeout(() => intro.remove(), 1000);
  }
  skip.addEventListener('click', closeIntro);
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeIntro();
  });
  const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 100 : 4200;
  window.setTimeout(closeIntro, delay);
  skip.focus();
}());
</script>
</body>
</html>
